<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="594mm" height="420mm" viewBox="0 0 594 420" version="1.1"><title>Fruchter House — Rule-Based Overlap Models</title><desc>A2 landscape vector architectural study. Real dimensions unknown; all new rotation, programme and wall changes are design proposals.</desc><path d="M 0.00000,0.00000 L 594.00000,0.00000 L 594.00000,420.00000 L 0.00000,420.00000 Z" fill="#FFF" stroke="none" stroke-width="0.2" stroke-linejoin="miter" /><defs><pattern id="hatch-blue" patternUnits="userSpaceOnUse" width="2.4" height="2.4"><path d="M -1,1 L 1,-1 M 0,2.4 L 2.4,0 M 1.4,3.4 L 3.4,1.4" fill="none" stroke="#477CA0" stroke-width="0.1" /></pattern><pattern id="hatch-green" patternUnits="userSpaceOnUse" width="2.4" height="2.4"><circle cx="0.7" cy="0.7" r="0.17" fill="#44846C" /></pattern><pattern id="hatch-orange" patternUnits="userSpaceOnUse" width="2.4" height="2.4"><path d="M -1,1 L 1,-1 M 0,2.4 L 2.4,0 M 1.4,3.4 L 3.4,1.4" fill="none" stroke="#BC6B3F" stroke-width="0.1" /><path d="M 0,0 L 2.4,2.4" fill="none" stroke="#BC6B3F" stroke-width="0.1" /></pattern><pattern id="hatch-gray" patternUnits="userSpaceOnUse" width="2.4" height="2.4"><path d="M -1,1 L 1,-1 M 0,2.4 L 2.4,0 M 1.4,3.4 L 3.4,1.4" fill="none" stroke="#647174" stroke-width="0.1" /></pattern></defs><g id="00_Header" inkscape:groupmode="layer" inkscape:label="00_Header"><text x="18" y="17" fill="#647174" font-size="2.998611111111111" font-family="Instrument Sans" font-weight="400" text-anchor="start" data-font="EN">FRUCHTER HOUSE 1951 / LOUIS I. KAHN / SPATIAL RECONSTRUCTION</text><text x="18" y="32" fill="#242E31" font-size="10.230555555555554" font-family="Instrument Sans" font-weight="400" text-anchor="start" data-font="EN">WHAT SHOULD BE EMPTIED?</text><text x="18" y="45" fill="#242E31" font-size="4.303888888888888" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">같은 중첩 모델에서도 삭제 규칙에 따라 중심·접점·연결이 달라진다.</text><text x="576" y="21" fill="#BC6B3F" font-size="3.3513888888888888" font-family="Instrument Sans" font-weight="400" text-anchor="end" data-font="EN">03 / VOID POLICY</text><text x="576" y="34" fill="#647174" font-size="2.822222222222222" font-family="Instrument Sans" font-weight="400" text-anchor="end" data-font="EN">A2 LANDSCAPE / 594 × 420 mm</text><path d="M 18.00000,54.00000 L 576.00000,54.00000" fill="none" stroke="#242E31" stroke-width="0.3" stroke-linejoin="miter" /><text x="18" y="76" fill="#242E31" font-size="3.880555555555555" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">P0 / 전부 유지</text><path d="M 59.87367,134.96115 L 33.83146,127.98316 L 42.73484,94.75531 L 85.53463,106.22348 L 104.59885,87.15927 L 128.92332,111.48374 L 97.59170,142.81537 L 104.56969,168.85757 L 71.34184,177.76094 Z " fill="#E2E5E3" stroke="#242E31" stroke-width="0.3" fill-rule="evenodd" /><path d="M 85.53463,106.22348 L 94.65335,108.66684 L 91.54749,120.25807 L 90.65816,116.93906 L 69.02155,122.73657 Z " fill="#E8BD9D" stroke="#BC6B3F" stroke-width="0.2" fill-rule="evenodd" /><path d="M 97.59170,142.81537 L 90.91633,149.49073 L 82.43096,141.00536 L 85.74998,141.89469 L 91.54749,120.25807 Z " fill="#E8BD9D" stroke="#BC6B3F" stroke-width="0.2" fill-rule="evenodd" /><path d="M 59.87367,134.96115 L 57.43031,125.84243 L 69.02155,122.73657 L 66.59186,125.16626 L 82.43096,141.00536 Z " fill="#E8BD9D" stroke="#BC6B3F" stroke-width="0.2" fill-rule="evenodd" /><path d="M 82.43096,141.00536 L 66.59186,125.16626 L 69.02155,122.73657 L 90.65816,116.93906 L 91.54749,120.25807 L 85.74998,141.89469 Z " fill="#A9524D" stroke="none" stroke-width="0.23" fill-rule="evenodd" /><text x="18" y="191" fill="#242E31" font-size="3.175" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">연속 실내 영역 1개 / 2.337 u²</text><text x="18" y="202.0" fill="#647174" font-size="3.0338888888888884" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">세 겹 T가 실내 중심이 된다. 공유 접점은 있지만 중앙 홀의 위계가 강해진다.</text><text x="158" y="76" fill="#242E31" font-size="3.880555555555555" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">P1 / 모든 중첩 삭제</text><path d="M 199.87367,134.96115 L 222.43096,141.00536 L 230.91633,149.49073 L 237.59170,142.81537 L 244.56969,168.85757 L 211.34184,177.76094 Z " fill="#E2E5E3" stroke="#242E31" stroke-width="0.3" fill-rule="evenodd" /><path d="M 173.83146,127.98316 L 182.73484,94.75531 L 225.53463,106.22348 L 209.02155,122.73657 L 197.43031,125.84243 L 199.87367,134.96115 Z " fill="#E2E5E3" stroke="#242E31" stroke-width="0.3" fill-rule="evenodd" /><path d="M 244.59885,87.15927 L 268.92332,111.48374 L 237.59170,142.81537 L 231.54749,120.25807 L 231.54749,120.25807 L 231.54749,120.25807 L 234.65335,108.66684 L 225.53463,106.22348 Z " fill="#E2E5E3" stroke="#242E31" stroke-width="0.3" fill-rule="evenodd" /><path d="M 231.54749,120.25807 L 231.54749,120.25807 L 237.59170,142.81537 L 230.91633,149.49073 L 222.43096,141.00536 L 199.87367,134.96115 L 197.43031,125.84243 L 209.02155,122.73657 L 225.53463,106.22348 L 234.65335,108.66684 L 231.54749,120.25807 Z " fill="white" stroke="#44846C" stroke-width="0.25" fill-rule="evenodd" /><text x="158" y="191" fill="#242E31" font-size="3.175" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">연속 실내 영역 3개 / 1.856 u²</text><text x="158" y="202.0" fill="#647174" font-size="3.0338888888888884" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">한 겹 영역만 남는다. 세 군의 실내 연결이 끊어지므로 보류한다.</text><text x="298" y="76" fill="#242E31" font-size="3.880555555555555" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">P2 / 두 겹만 삭제</text><path d="M 339.87367,134.96115 L 362.43096,141.00536 L 370.91633,149.49073 L 377.59170,142.81537 L 384.56969,168.85757 L 351.34184,177.76094 Z " fill="#E2E5E3" stroke="#242E31" stroke-width="0.3" fill-rule="evenodd" /><path d="M 313.83146,127.98316 L 322.73484,94.75531 L 365.53463,106.22348 L 349.02155,122.73657 L 337.43031,125.84243 L 339.87367,134.96115 Z " fill="#E2E5E3" stroke="#242E31" stroke-width="0.3" fill-rule="evenodd" /><path d="M 384.59885,87.15927 L 408.92332,111.48374 L 377.59170,142.81537 L 371.54749,120.25807 L 365.74998,141.89469 L 362.43096,141.00536 L 346.59186,125.16626 L 349.02155,122.73657 L 370.65816,116.93906 L 371.54749,120.25807 L 374.65335,108.66684 L 365.53463,106.22348 Z " fill="#E2E5E3" stroke="#242E31" stroke-width="0.3" fill-rule="evenodd" /><path d="M 370.91633,149.49073 L 362.43096,141.00536 L 365.74998,141.89469 L 371.54749,120.25807 L 377.59170,142.81537 Z " fill="white" stroke="#44846C" stroke-width="0.25" fill-rule="evenodd" /><path d="M 349.02155,122.73657 L 346.59186,125.16626 L 362.43096,141.00536 L 339.87367,134.96115 L 337.43031,125.84243 Z " fill="white" stroke="#44846C" stroke-width="0.25" fill-rule="evenodd" /><path d="M 371.54749,120.25807 L 370.65816,116.93906 L 349.02155,122.73657 L 365.53463,106.22348 L 374.65335,108.66684 Z " fill="white" stroke="#44846C" stroke-width="0.25" fill-rule="evenodd" /><path d="M 362.43096,141.00536 L 346.59186,125.16626 L 349.02155,122.73657 L 370.65816,116.93906 L 371.54749,120.25807 L 365.74998,141.89469 Z " fill="#A9524D" stroke="none" stroke-width="0.23" fill-rule="evenodd" /><text x="298" y="191" fill="#242E31" font-size="3.175" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">연속 실내 영역 4개 / 2.039 u²</text><text x="298" y="202.0" fill="#647174" font-size="3.0338888888888884" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">공유 접점을 없애면 중앙 T와 세 군이 분리된다. 점 접촉은 통로가 아니다.</text><path d="M 435.00000,64.00000 L 572.00000,64.00000 L 572.00000,234.00000 L 435.00000,234.00000 Z" fill="none" stroke="#BC6B3F" stroke-width="0.5" stroke-linejoin="miter" /><text x="438" y="76" fill="#242E31" font-size="3.880555555555555" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">P3 / 세 겹만 삭제</text><path d="M 479.87367,134.96115 L 453.83146,127.98316 L 462.73484,94.75531 L 505.53463,106.22348 L 524.59885,87.15927 L 548.92332,111.48374 L 517.59170,142.81537 L 524.56969,168.85757 L 491.34184,177.76094 Z M 502.43096,141.00536 L 505.74998,141.89469 L 511.54749,120.25807 L 510.65816,116.93906 L 489.02155,122.73657 L 486.59186,125.16626 Z " fill="#E2E5E3" stroke="#242E31" stroke-width="0.3" fill-rule="evenodd" /><path d="M 486.59186,125.16626 L 489.02155,122.73657 L 510.65816,116.93906 L 511.54749,120.25807 L 505.74998,141.89469 L 502.43096,141.00536 Z " fill="white" stroke="#44846C" stroke-width="0.25" fill-rule="evenodd" /><path d="M 505.53463,106.22348 L 514.65335,108.66684 L 511.54749,120.25807 L 510.65816,116.93906 L 489.02155,122.73657 Z " fill="#E8BD9D" stroke="#BC6B3F" stroke-width="0.2" fill-rule="evenodd" /><path d="M 517.59170,142.81537 L 510.91633,149.49073 L 502.43096,141.00536 L 505.74998,141.89469 L 511.54749,120.25807 Z " fill="#E8BD9D" stroke="#BC6B3F" stroke-width="0.2" fill-rule="evenodd" /><path d="M 479.87367,134.96115 L 477.43031,125.84243 L 489.02155,122.73657 L 486.59186,125.16626 L 502.43096,141.00536 Z " fill="#E8BD9D" stroke="#BC6B3F" stroke-width="0.2" fill-rule="evenodd" /><text x="438" y="191" fill="#242E31" font-size="3.175" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">연속 실내 영역 1개 / 2.154 u²</text><text x="438" y="202.0" fill="#647174" font-size="3.0338888888888884" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">세 군과 세 공유 접점이 연결된다. 중앙은 비우고 관계를 가장자리로 옮긴다.</text><path d="M 18.00000,243.00000 L 576.00000,243.00000" fill="none" stroke="#DCE1E1" stroke-width="0.25" stroke-linejoin="miter" /><text x="18" y="257" fill="#242E31" font-size="4.58611111111111" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">원래 외곽에도 같은 규칙이 작동하는가?</text><path d="M 106.37716,355.05686 L 76.24027,363.13202 L 65.83891,324.31360 L 42.21924,317.98473 L 50.29439,287.84784 L 89.11281,298.24921 L 106.40361,280.95841 L 128.46534,303.02014 L 100.04828,331.43719 Z " fill="#E2E5E3" stroke="#242E31" stroke-width="0.32" fill-rule="evenodd" /><path d="M 89.11281,298.24921 L 97.38327,300.46527 L 94.56633,310.97825 L 93.75973,307.96798 L 74.13582,313.22619 Z " fill="#E8BD9D" stroke="#BC6B3F" stroke-width="0.17" fill-rule="evenodd" /><path d="M 100.04828,331.43719 L 93.99388,337.49159 L 86.29785,329.79556 L 89.30812,330.60216 L 94.56633,310.97825 Z " fill="#E8BD9D" stroke="#BC6B3F" stroke-width="0.17" fill-rule="evenodd" /><path d="M 65.83891,324.31360 L 63.62284,316.04314 L 74.13582,313.22619 L 71.93215,315.42986 L 86.29785,329.79556 Z " fill="#E8BD9D" stroke="#BC6B3F" stroke-width="0.17" fill-rule="evenodd" /><path d="M 86.29785,329.79556 L 71.93215,315.42986 L 74.13582,313.22619 L 93.75973,307.96798 L 94.56633,310.97825 L 89.30812,330.60216 Z " fill="white" stroke="#44846C" stroke-width="0.28" fill-rule="evenodd" /><text x="85" y="376" fill="#242E31" font-size="3.5277777777777777" font-family="Noto Sans KR" font-weight="450" text-anchor="middle" data-font="KR">공통 모듈 / 선정안</text><text x="85" y="386" fill="#242E31" font-size="2.9280555555555554" font-family="Noto Sans KR" font-weight="450" text-anchor="middle" data-font="KR">V 0.183 u² / 실내 71.8%</text><path d="M 276.75227,349.39132 L 239.63522,360.17646 L 230.41307,326.70675 L 212.69948,321.96041 L 223.81355,285.92382 L 257.10363,293.84034 L 268.62601,282.31796 L 295.70260,308.20093 L 272.05239,331.85113 Z " fill="#E2E5E3" stroke="#242E31" stroke-width="0.32" fill-rule="evenodd" /><path d="M 257.37798,313.48112 L 257.37798,313.48112 L 247.26466,316.52922 L 240.69490,310.24907 L 257.10363,293.84034 L 261.06042,294.78128 Z " fill="#E8BD9D" stroke="#BC6B3F" stroke-width="0.17" fill-rule="evenodd" /><path d="M 255.27066,324.18229 L 257.37798,313.48112 L 266.40144,310.76150 L 272.05239,331.85113 L 267.77148,336.13204 Z " fill="#E8BD9D" stroke="#BC6B3F" stroke-width="0.17" fill-rule="evenodd" /><path d="M 247.26466,316.52922 L 255.27066,324.18229 L 253.55256,332.90696 L 230.41307,326.70675 L 229.11595,321.99915 Z " fill="#E8BD9D" stroke="#BC6B3F" stroke-width="0.17" fill-rule="evenodd" /><path d="M 255.27066,324.18229 L 247.26466,316.52922 L 257.37798,313.48112 Z " fill="white" stroke="#44846C" stroke-width="0.28" fill-rule="evenodd" /><text x="253" y="376" fill="#242E31" font-size="3.5277777777777777" font-family="Noto Sans KR" font-weight="450" text-anchor="middle" data-font="KR">원래 외곽 재적용</text><text x="253" y="386" fill="#242E31" font-size="2.9280555555555554" font-family="Noto Sans KR" font-weight="450" text-anchor="middle" data-font="KR">V 0.033 u² / 실내 80.1%</text><text x="355" y="273" fill="#242E31" font-size="3.880555555555555" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">유지되는 것과 달라지는 것</text><text x="355" y="284.0" fill="#647174" font-size="3.1044444444444443" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">동일한 중심·배치 반경·공통 회전 위상을 적용하면 원래 외곽에서도 세 공유 접점과 삼중 영역이 생긴다. 세 군의 관계 구조는 이어진다.</text><text x="355" y="311.0" fill="#647174" font-size="3.1044444444444443" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">그러나 삼중 영역은 0.183에서 0.033 u²로 약 82% 작아진다. 접점도 서로 같은 모양이 아니며 정확한 회전 대칭은 성립하지 않는다.</text><text x="355" y="340.0" fill="#647174" font-size="3.1044444444444443" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">따라서 정규화는 단순한 표현 정리가 아니라 공간을 바꾸는 설계 조작이다. 이번안은 세 군의 총면적과 관계 원리를 유지하면서 외곽·종횡비를 재구성한 모델이다.</text><text x="355" y="374.0" fill="#647174" font-size="2.8927777777777774" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">원래 외곽 보존이 우선되는 다음 단계에서는 이 재적용안을 출발점으로 반경과 비움의 규모를 다시 조정해야 한다.</text></g><g id="99_Footer" inkscape:groupmode="layer" inkscape:label="99_Footer"><path d="M 18.00000,408.00000 L 576.00000,408.00000" fill="none" stroke="#DCE1E1" stroke-width="0.18" stroke-linejoin="miter" /><text x="18" y="415" fill="#647174" font-size="2.504722222222222" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">점·선만 닿는 연결을 실제 통로로 세지 않는다. 삭제 규칙 비교는 동일한 M4에서 수행 / 원래 외곽 비교는 별도 민감도 검토.</text><text x="576" y="415" fill="#647174" font-size="2.504722222222222" font-family="Instrument Sans" font-weight="400" text-anchor="end" data-font="EN">NTS / DESIGN PROPOSAL</text></g></svg>