N">C</text><circle cx="136.06564549016787" cy="157.11748" r="1.7" fill="#FFF" stroke="#44846C" stroke-width="0.14" /><text x="136.06564549016787" y="157.86748" fill="#44846C" font-size="3.880555555555555" font-family="Instrument Sans" font-weight="400" text-anchor="middle" data-font="EN">V</text><path d="M 332.49997,175.31061 L 389.87891,198.56824 L 414.98261,142.97171 L 361.96083,114.70330 Z" fill="none" stroke="#929B99" stroke-width="0.18" stroke-linejoin="miter" stroke-dasharray="1.2 0.7" /><circle cx="374.02070171188484" cy="159.14116" r="1.7" fill="#FFF" stroke="#242E31" stroke-width="0.14" /><text x="374.02070171188484" y="159.89116" fill="#242E31" font-size="3.175" font-family="Instrument Sans" font-weight="400" text-anchor="middle" data-font="EN">A</text><path d="M 374.12712,195.91107 L 436.88269,191.13366 L 431.01293,131.74110 L 368.25709,136.51824 Z" fill="none" stroke="#929B99" stroke-width="0.18" stroke-linejoin="miter" stroke-dasharray="1.2 0.7" /><circle cx="402.5699443503955" cy="163.825952" r="1.7" fill="#FFF" stroke="#242E31" stroke-width="0.14" /><text x="402.5699443503955" y="164.575952" fill="#242E31" font-size="3.175" font-family="Instrument Sans" font-weight="400" text-anchor="middle" data-font="EN">B</text><path d="M 332.37702,217.99530 L 390.82058,237.41501 L 412.17829,177.37944 L 353.10424,158.40118 Z" fill="none" stroke="#929B99" stroke-width="0.18" stroke-linejoin="miter" stroke-dasharray="1.2 0.7" /><circle cx="372.19698746263566" cy="197.687368" r="1.7" fill="#FFF" stroke="#242E31" stroke-width="0.14" /><text x="372.19698746263566" y="198.437368" fill="#242E31" font-size="3.175" font-family="Instrument Sans" font-weight="400" text-anchor="middle" data-font="EN">C</text><circle cx="388.77109016169976" cy="158.512976" r="1.7" fill="#FFF" stroke="#44846C" stroke-width="0.14" /><text x="388.77109016169976" y="159.262976" fill="#44846C" font-size="3.880555555555555" font-family="Instrument Sans" font-weight="400" text-anchor="middle" data-font="EN">V</text><path d="M 390.82058,237.41501 L 413.00000,274.92000 L 468.76000,235.48000 L 436.88269,191.13366 L 406.46139,193.44947 Z " fill="#EDF0E6" stroke="#44846C" stroke-width="0.2" fill-rule="evenodd" /><path d="M 390.82058,237.41501 L 413.00000,274.92000 L 468.76000,235.48000 L 436.88269,191.13366 L 406.46139,193.44947 Z " fill="url(#hatch-green)" stroke="none" stroke-width="0.25" fill-rule="evenodd" /><circle cx="426.3194255323487" cy="214.46473600000002" r="1.7" fill="#FFF" stroke="#44846C" stroke-width="0.14" /><text x="426.3194255323487" y="215.21473600000002" fill="#44846C" font-size="3.5277777777777777" font-family="Instrument Sans" font-weight="400" text-anchor="middle" data-font="EN">E</text><path d="M 384.71146,191.48400 L 417.87642,184.06683 L 394.71371,176.62546 L 408.98664,145.01498 L 397.56318,138.92462 L 373.32363,140.76987 L 376.28218,170.70402 L 355.98880,164.18445 L 351.21547,177.90739 L 384.71146,191.48400" fill="none" stroke="#BC6B3F" stroke-width="0.35" stroke-linejoin="miter" stroke-dasharray="1.2 0.65" /><path d="M 453.80000,243.64000 L 422.54021,192.22548 L 417.08000,188.96800" fill="none" stroke="#BC6B3F" stroke-width="0.4" stroke-linejoin="miter" /><path d="M 417.08000,188.96800 L 418.86750,189.17974 L 418.11542,190.44038 Z" fill="#BC6B3F" stroke="none" stroke-width="0.2" stroke-linejoin="miter" /><text x="306" y="282" fill="#BC6B3F" font-size="3.81" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">선정: 도서관·공유작업소의 연결된 실내를 우선</text><text x="306" y="291" fill="#647174" font-size="3.0338888888888884" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">독립된 방향은 남기되 경계 일부를 공유한다. 중정은 채광·시선의 중심, 실내 띠는 이동·만남의 중심이다. 외부 E는 큰 모임을 받아 안쪽 중정의 과밀을 줄인다.</text><path d="M 18.00000,317.00000 L 79.00142,317.00000" fill="none" stroke="#242E31" stroke-width="0.5" stroke-linejoin="miter" /><path d="M 18.00000,316.00000 L 18.00000,318.00000" fill="none" stroke="#242E31" stroke-width="0.2" stroke-linejoin="miter" /><path d="M 48.50071,316.00000 L 48.50071,318.00000" fill="none" stroke="#242E31" stroke-width="0.2" stroke-linejoin="miter" /><path d="M 79.00142,316.00000 L 79.00142,318.00000" fill="none" stroke="#242E31" stroke-width="0.2" stroke-linejoin="miter" /><text x="18" y="321" fill="#242E31" font-size="2.469444444444444" font-family="Instrument Sans" font-weight="400" text-anchor="start" data-font="EN">0</text><text x="79.00142004904477" y="321" fill="#242E31" font-size="2.469444444444444" font-family="Instrument Sans" font-weight="400" text-anchor="end" data-font="EN">1 U</text><text x="97" y="318" fill="#647174" font-size="2.8927777777777774" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">동일한 상대 축척 / 외곽선 기준 비교</text><path d="M 18.00000,330.00000 L 576.00000,330.00000" fill="none" stroke="#242E31" stroke-width="0.25" stroke-linejoin="miter" /><path d="M 18.00000,334.00000 L 576.00000,334.00000 L 576.00000,343.00000 L 18.00000,343.00000 Z" fill="#F1F3F2" stroke="none" stroke-width="0.2" stroke-linejoin="miter" /><text x="21" y="340" fill="#242E31" font-size="3.175" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">비교 항목</text><text x="258" y="340" fill="#242E31" font-size="3.175" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">A  벌림</text><text x="418" y="340" fill="#242E31" font-size="3.175" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">B  선택적 비움</text><text x="21" y="350" fill="#242E31" font-size="2.998611111111111" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">실내 외곽 면적 / 원래 세 공간군 면적 합</text><text x="258" y="350" fill="#242E31" font-size="2.998611111111111" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">122.4%  /  3.810 U²</text><text x="418" y="350" fill="#242E31" font-size="2.998611111111111" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">63.2%  /  1.969 U²</text><path d="M 18.00000,353.00000 L 576.00000,353.00000" fill="none" stroke="#DCE1E1" stroke-width="0.13" stroke-linejoin="miter" /><text x="21" y="360" fill="#242E31" font-size="2.998611111111111" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">하늘에 열린 안쪽 마당</text><text x="258" y="360" fill="#242E31" font-size="2.998611111111111" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">1.104 U²</text><text x="418" y="360" fill="#242E31" font-size="2.998611111111111" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">0.218 U²</text><path d="M 18.00000,363.00000 L 576.00000,363.00000" fill="none" stroke="#DCE1E1" stroke-width="0.13" stroke-linejoin="miter" /><text x="21" y="370" fill="#242E31" font-size="2.998611111111111" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">실내 공유 띠 / 바닥의 연속성</text><text x="258" y="370" fill="#242E31" font-size="2.998611111111111" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">0.697 U² / 연결됨</text><text x="418" y="370" fill="#242E31" font-size="2.998611111111111" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">0.541 U² / 연결됨</text><path d="M 18.00000,373.00000 L 576.00000,373.00000" fill="none" stroke="#DCE1E1" stroke-width="0.13" stroke-linejoin="miter" /><text x="21" y="380" fill="#242E31" font-size="2.998611111111111" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">얻는 것 / 치르는 비용</text><text x="258" y="380" fill="#242E31" font-size="2.998611111111111" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">큰 공동 마당 / 외곽 확장·긴 이동</text><text x="418" y="380" fill="#242E31" font-size="2.998611111111111" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">가까운 접점·연속 실내 / 사용 면적 감소</text><path d="M 18.00000,383.00000 L 576.00000,383.00000" fill="none" stroke="#DCE1E1" stroke-width="0.13" stroke-linejoin="miter" /><text x="18" y="398" fill="#647174" font-size="2.822222222222222" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">면적은 벽 두께를 공제하지 않은 도형 면적. 대지·법규·실측 면적 미확인으로 수용 인원이나 성능 우열을 확정하지 않는다.</text></g><g id="99_Footer" inkscape:groupmode="layer" inkscape:label="99_Footer"><path d="M 18.00000,408.00000 L 576.00000,408.00000" fill="none" stroke="#DCE1E1" stroke-width="0.18" stroke-linejoin="miter" /><text x="18" y="415" fill="#647174" font-size="2.504722222222222" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">판단 기준: 내부 연결·조용한 열람·외부 모임의 분리. A를 폐기하지 않고 비교 대안으로 유지한다.</text><text x="576" y="415" fill="#647174" font-size="2.504722222222222" font-family="Instrument Sans" font-weight="400" text-anchor="end" data-font="EN">NTS / DESIGN PROPOSAL</text></g></svg>