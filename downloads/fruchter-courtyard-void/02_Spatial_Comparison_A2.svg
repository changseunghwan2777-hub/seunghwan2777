중정과 겹쳐 비우는 중정은, 같은 빈 공간이지만 다른 관계를 만든다.</text><text x="576" y="21" fill="#BC6B3F" font-size="3.3513888888888888" font-family="Instrument Sans" font-weight="400" text-anchor="end" data-font="EN">02 / COMPARATIVE STUDY</text><text x="576" y="34" fill="#647174" font-size="2.822222222222222" font-family="Instrument Sans" font-weight="400" text-anchor="end" data-font="EN">A2 LANDSCAPE / 594 × 420 mm</text><path d="M 18.00000,54.00000 L 576.00000,54.00000" fill="none" stroke="#242E31" stroke-width="0.3" stroke-linejoin="miter" /><text x="18" y="70" fill="#242E31" font-size="5.644444444444444" font-family="Instrument Sans" font-weight="400" text-anchor="start" data-font="EN">A / EXPANDED COURT</text><text x="306" y="70" fill="#242E31" font-size="5.644444444444444" font-family="Instrument Sans" font-weight="400" text-anchor="start" data-font="EN">B / SELECTIVE SUBTRACTION</text><text x="18" y="80" fill="#242E31" font-size="3.5277777777777777" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">바깥의 공동 마당 + 둘레의 실내 연결</text><text x="306" y="80" fill="#242E31" font-size="3.5277777777777777" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">안쪽의 빛마당 + 연결을 유지하는 실내 띠</text><path d="M 28.61997,157.08661 L 85.99891,180.34424 L 83.22424,200.56118 L 62.49702,260.15530 L 120.94058,279.57501 L 142.29829,219.53944 L 177.41512,183.67107 L 240.17069,178.89366 L 234.30093,119.50110 L 171.54509,124.27824 L 111.10261,124.74771 L 58.08083,96.47930 Z M 94.97899,182.92906 L 117.09477,133.94947 L 163.17238,133.59152 L 167.78741,180.28549 L 139.68709,208.98720 L 93.44165,194.13002 Z " fill="#E2E4E3" stroke="#242E31" stroke-width="0.35" fill-rule="evenodd" /><path d="M 142.29829,219.53944 L 177.41512,183.67107 L 171.54509,124.27824 L 111.10261,124.74771 L 85.99891,180.34424 L 83.22424,200.56118 Z M 94.97899,182.92906 L 117.09477,133.94947 L 163.17238,133.59152 L 167.78741,180.28549 L 139.68709,208.98720 L 93.44165,194.13002 Z " fill="#F1D8CD" 