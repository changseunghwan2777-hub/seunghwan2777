<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="594mm" height="420mm" viewBox="0 0 594 420" version="1.1"><title>Fruchter House — Rule-Based Overlap Models</title><desc>A2 landscape vector architectural study. Real dimensions unknown; all new rotation, programme and wall changes are design proposals.</desc><path d="M 0.00000,0.00000 L 594.00000,0.00000 L 594.00000,420.00000 L 0.00000,420.00000 Z" fill="#FFF" stroke="none" stroke-width="0.2" stroke-linejoin="miter" /><defs><pattern id="hatch-blue" patternUnits="userSpaceOnUse" width="2.4" height="2.4"><path d="M -1,1 L 1,-1 M 0,2.4 L 2.4,0 M 1.4,3.4 L 3.4,1.4" fill="none" stroke="#477CA0" stroke-width="0.1" /></pattern><pattern id="hatch-green" patternUnits="userSpaceOnUse" width="2.4" height="2.4"><circle cx="0.7" cy="0.7" r="0.17" fill="#44846C" /></pattern><pattern id="hatch-orange" patternUnits="userSpaceOnUse" width="2.4" height="2.4"><path d="M -1,1 L 1,-1 M 0,2.4 L 2.4,0 M 1.4,3.4 L 3.4,1.4" fill="none" stroke="#BC6B3F" stroke-width="0.1" /><path d="M 0,0 L 2.4,2.4" fill="none" stroke="#BC6B3F" stroke-width="0.1" /></pattern><pattern id="hatch-gray" patternUnits="userSpaceOnUse" width="2.4" height="2.4"><path d="M -1,1 L 1,-1 M 0,2.4 L 2.4,0 M 1.4,3.4 L 3.4,1.4" fill="none" stroke="#647174" stroke-width="0.1" /></pattern></defs><g id="00_Header" inkscape:groupmode="layer" inkscape:label="00_Header"><text x="18" y="17" fill="#647174" font-size="2.998611111111111" font-family="Instrument Sans" font-weight="400" text-anchor="start" data-font="EN">FRUCHTER HOUSE 1951 / LOUIS I. KAHN / SPATIAL RECONSTRUCTION</text><text x="18" y="32" fill="#242E31" font-size="10.230555555555554" font-family="Instrument Sans" font-weight="400" text-anchor="start" data-font="EN">ONE RULE, DIFFERENT SHARED SPACES</text><text x="18" y="45" fill="#242E31" font-size="4.303888888888888" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">중첩이 크고 작아지는 것뿐 아니라, 만나는 각도와 경계의 형태도 달라진다</text><text x="576" y="21" fill="#BC6B3F" font-size="3.3513888888888888" font-family="Instrument Sans" font-weight="400" text-anchor="end" data-font="EN">05 / CONTACTS</text><text x="576" y="34" fill="#647174" font-size="2.822222222222222" font-family="Instrument Sans" font-weight="400" text-anchor="end" data-font="EN">A2 LANDSCAPE / 594 × 420 mm</text><path d="M 18.00000,54.00000 L 576.00000,54.00000" fill="none" stroke="#242E31" stroke-width="0.3" stroke-linejoin="miter" /><text x="18" y="68" fill="#A73732" font-size="3.880555555555555" font-family="Instrument Sans" font-weight="400" text-anchor="start" data-font="EN">01  THIN THRESHOLD</text><path d="M 67.02316,150.03495 L 69.73989,121.09232 L 106.66847,124.55866 L 102.20358,172.12525 L 111.89074,179.00000 L 43.40909,179.00000 L 43.40909,160.86506 L 67.02316,150.03495 Z " fill="#F1F0ED" stroke="#888" stroke-width="0.17" fill-rule="evenodd" /><path d="M 142.66560,155.93087 L 114.48173,163.05313 L 105.39428,127.09268 L 151.71386,115.38741 L 159.63774,87.41834 L 168.59091,89.95485 L 168.59091,179.00000 L 165.08534,179.00000 L 142.66560,155.93087 Z " fill="#F1F0ED" stroke="#888" stroke-width="0.17" fill-rule="evenodd" /><path d="M 64.32373,178.79322 L 64.66997,175.10455 L 78.64790,155.40835 L 81.66926,157.55254 L 91.50570,179.00000 L 66.52664,179.00000 L 64.32373,178.79322 Z " fill="#FFF" stroke="#BBB" stroke-width="0.1" fill-rule="evenodd" /><path d="M 167.07796,149.76170 L 143.84045,143.17831 L 144.85033,139.61372 L 162.17047,122.78114 L 164.75256,125.43802 L 168.59091,140.62698 L 168.59091,149.37937 L 167.07796,149.76170 Z " fill="#FFF" stroke="#BBB" stroke-width="0.1" fill-rule="evenodd" /><path d="M 105.39428,127.09268 L 106.45579,126.82443 L 106.14993,130.08290 L 105.39428,127.09268 Z " fill="#171717" stroke="none" stroke-width="0.2" fill-rule="evenodd" /><text x="18" y="187" fill="#242E31" font-size="2.9280555555555554" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">41 / 42 · Δθ 10.5° · Ø 0.02u</text><text x="18" y="198" fill="#242E31" font-size="3.5277777777777777" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">가는 경계 / 보조 접점</text><text x="18" y="208.0" fill="#647174" font-size="3.175" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">좁게 겹치는 틈은 주요 동선으로 세지 않는다. 시선·경계 조정 대상으로 남긴다.</text><text x="206" y="68" fill="#A73732" font-size="3.880555555555555" font-family="Instrument Sans" font-weight="400" text-anchor="start" data-font="EN">02  SMALL ANGLE DIFFERENCE</text><path d="M 231.40909,174.23424 L 231.40909,154.36392 L 243.79630,127.35473 L 231.40909,109.89999 L 231.40909,100.49929 L 257.22014,82.18180 L 284.87015,121.14324 L 313.81279,118.42651 L 317.27913,155.35509 L 269.71253,159.81998 L 260.91601,179.00000 L 241.80039,179.00000 L 231.40909,174.23424 Z " fill="#F1F0ED" stroke="#888" stroke-width="0.17" fill-rule="evenodd" /><path d="M 271.04165,128.37401 L 290.86536,84.90521 L 285.22978,77.00000 L 330.78098,77.00000 L 331.92584,78.60593 L 348.65025,77.00000 L 356.59091,77.00000 L 356.59091,113.49903 L 316.85093,117.31498 L 304.78889,143.76425 L 271.04165,128.37401 Z " fill="#F1F0ED" stroke="#888" stroke-width="0.17" fill-rule="evenodd" /><path d="M 260.51321,150.91040 L 258.36902,147.88904 L 256.11188,123.84266 L 259.80055,123.49642 L 281.75389,133.56487 L 280.20941,136.93248 L 260.51321,150.91040 Z " fill="#FFF" stroke="#BBB" stroke-width="0.1" fill-rule="evenodd" /><path d="M 307.63258,108.42509 L 305.48194,105.40832 L 303.17340,81.36683 L 306.86133,81.01270 L 328.83614,91.03420 L 327.29886,94.40509 L 307.63258,108.42509 Z " fill="#FFF" stroke="#BBB" stroke-width="0.1" fill-rule="evenodd" /><path d="M 313.81279,118.42651 L 314.24485,123.02951 L 304.78889,143.76425 L 271.04165,128.37401 L 278.45904,112.10939 L 284.87015,121.14324 L 313.81279,118.42651 Z " fill="#171717" stroke="none" stroke-width="0.2" fill-rule="evenodd" /><text x="206" y="187" fill="#242E31" font-size="2.9280555555555554" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">15 / 25 · Δθ 0.1° · Ø 0.44u</text><text x="206" y="198" fill="#242E31" font-size="3.5277777777777777" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">작은 상대 회전 / 비대칭 접합</text><text x="206" y="208.0" fill="#647174" font-size="3.175" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">모듈 전체의 방향은 가깝지만 서로 다른 날개가 만나 비대칭 공유 영역을 만든다.</text><text x="394" y="68" fill="#A73732" font-size="3.880555555555555" font-family="Instrument Sans" font-weight="400" text-anchor="start" data-font="EN">03  OBLIQUE CONTACT</text><path d="M 430.84258,170.28914 L 419.40909,171.00127 L 419.40909,133.83849 L 447.20651,132.10714 L 460.14833,106.07704 L 493.36074,122.58981 L 472.09113,165.36971 L 481.13475,179.00000 L 436.62219,179.00000 L 430.84258,170.28914 Z " fill="#F1F0ED" stroke="#888" stroke-width="0.17" fill-rule="evenodd" /><path d="M 496.39585,146.49924 L 470.56140,133.17115 L 487.56702,100.20837 L 530.02538,122.11280 L 544.59091,112.75808 L 544.59091,156.83990 L 534.32989,163.43004 L 535.06705,179.00000 L 497.93459,179.00000 L 496.39585,146.49924 Z " fill="#F1F0ED" stroke="#888" stroke-width="0.17" fill-rule="evenodd" /><path d="M 459.67140,168.49355 L 455.97368,168.72386 L 434.34712,157.97142 L 435.99653,154.65395 L 456.12169,141.30102 L 458.17001,144.38818 L 459.67140,168.49355 Z " fill="#FFF" stroke="#BBB" stroke-width="0.1" fill-rule="evenodd" /><path d="M 487.56674,101.98019 L 483.86600,101.80498 L 463.54419,88.75328 L 465.54630,85.63595 L 482.28576,77.00000 L 488.26777,77.00000 L 488.70894,77.85513 L 487.56674,101.98019 Z " fill="#FFF" stroke="#BBB" stroke-width="0.1" fill-rule="evenodd" /><path d="M 518.77320,158.04379 L 505.72150,137.72197 L 508.83883,135.71987 L 532.96389,134.57767 L 533.13910,138.27841 L 522.06574,159.74242 L 518.77320,158.04379 Z " fill="#FFF" stroke="#BBB" stroke-width="0.1" fill-rule="evenodd" /><path d="M 484.51956,140.37221 L 470.56140,133.17115 L 479.56020,115.72836 L 493.36074,122.58981 L 484.51956,140.37221 Z " fill="#171717" stroke="none" stroke-width="0.2" fill-rule="evenodd" /><text x="394" y="187" fill="#242E31" font-size="2.9280555555555554" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">22 / 23 · Δθ 30.9° · Ø 0.34u</text><text x="394" y="198" fill="#242E31" font-size="3.5277777777777777" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">사선 교차 / 방향 전환</text><text x="394" y="208.0" fill="#647174" font-size="3.175" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">두 방향이 큰 각도로 만나 진입 방향과 시선이 전환되는 공유 영역을 만든다.</text><text x="18" y="234" fill="#A73732" font-size="3.880555555555555" font-family="Instrument Sans" font-weight="400" text-anchor="start" data-font="EN">04  BROAD OVERLAP</text><path d="M 162.72614,345.00000 L 132.51089,345.00000 L 116.95796,314.85304 L 87.92062,313.47827 L 89.67472,276.42887 L 137.39695,278.68826 L 153.10620,254.22857 L 168.59091,264.17364 L 168.59091,298.75497 L 158.49707,314.47133 L 168.59091,334.03669 L 168.59091,341.97435 L 162.72614,345.00000 Z " fill="#F1F0ED" stroke="#888" stroke-width="0.17" fill-rule="evenodd" /><path d="M 103.58075,318.45433 L 70.28390,284.19304 L 43.40909,290.98448 L 43.40909,252.72758 L 79.33216,243.64958 L 79.51619,243.00000 L 118.06690,243.00000 L 109.91970,271.75733 L 130.17968,292.60415 L 103.58075,318.45433 Z " fill="#F1F0ED" stroke="#888" stroke-width="0.17" fill-rule="evenodd" /><path d="M 69.24314,345.00000 L 53.04044,345.00000 L 43.40909,343.64005 L 43.40909,338.73377 L 57.47041,320.76008 L 60.38842,323.04293 L 69.24314,345.00000 Z " fill="#FFF" stroke="#BBB" stroke-width="0.1" fill-rule="evenodd" /><path d="M 145.81032,316.21904 L 142.10958,316.04383 L 121.78777,302.99214 L 123.78988,299.87481 L 145.25388,288.80145 L 146.95252,292.09399 L 145.81032,316.21904 Z " fill="#FFF" stroke="#BBB" stroke-width="0.1" fill-rule="evenodd" /><path d="M 94.69626,278.02387 L 71.45875,271.44048 L 72.46863,267.87589 L 89.78877,251.04331 L 92.37086,253.70019 L 98.28823,277.11616 L 94.69626,278.02387 Z " fill="#FFF" stroke="#BBB" stroke-width="0.1" fill-rule="evenodd" /><path d="M 88.42344,302.85799 L 89.66666,276.59894 L 94.69626,278.02387 L 98.28823,277.11616 L 98.21675,276.83329 L 115.65514,277.65890 L 130.17968,292.60415 L 107.73563,314.41641 L 99.26682,314.01546 L 88.42344,302.85799 Z " fill="#171717" stroke="none" stroke-width="0.2" fill-rule="evenodd" /><text x="18" y="353" fill="#242E31" font-size="2.9280555555555554" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">33 / 42 · Δθ 16.9° · Ø 0.71u</text><text x="18" y="364" fill="#242E31" font-size="3.5277777777777777" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">넓은 접합 / 협업 장소</text><text x="18" y="374.0" fill="#647174" font-size="3.175" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">넓어진 공유 영역은 팀 사이의 공동 작업이나 협의 공간으로 우선 검토한다.</text><text x="206" y="234" fill="#A73732" font-size="3.880555555555555" font-family="Instrument Sans" font-weight="400" text-anchor="start" data-font="EN">05  THREE-MOTIF NODE</text><path d="M 231.40909,330.86208 L 231.40909,243.00000 L 248.88872,243.00000 L 270.42838,270.53277 L 299.21271,266.46841 L 304.39852,303.19500 L 257.09210,309.87470 L 246.21977,336.83484 L 231.40909,330.86208 Z " fill="#F1F0ED" stroke="#888" stroke-width="0.17" fill-rule="evenodd" /><path d="M 294.30079,320.18674 L 277.42607,296.51606 L 307.62803,274.98522 L 335.36126,313.88746 L 356.59091,311.84892 L 356.59091,345.00000 L 282.98483,345.00000 L 294.30079,320.18674 Z " fill="#F1F0ED" stroke="#888" stroke-width="0.17" fill-rule="evenodd" /><path d="M 268.59956,294.46563 L 283.18803,248.97176 L 277.76927,243.00000 L 354.07470,243.00000 L 356.59091,254.61775 L 356.59091,268.62466 L 312.79556,278.11001 L 303.91897,305.79147 L 268.59956,294.46563 Z " fill="#F1F0ED" stroke="#888" stroke-width="0.17" fill-rule="evenodd" /><path d="M 311.06801,343.70662 L 308.91737,340.68985 L 306.60883,316.64836 L 310.29675,316.29423 L 332.27157,326.31573 L 330.73429,329.68662 L 311.06801,343.70662 Z " fill="#FFF" stroke="#BBB" stroke-width="0.1" fill-rule="evenodd" /><path d="M 245.20419,298.48610 L 241.82740,274.57124 L 245.49590,274.05325 L 267.89516,283.08629 L 266.50951,286.52230 L 247.48704,301.40411 L 245.20419,298.48610 Z " fill="#FFF" stroke="#BBB" stroke-width="0.1" fill-rule="evenodd" /><path d="M 302.59815,270.36269 L 300.10852,267.61899 L 294.99611,244.01420 L 298.61704,243.22997 L 321.61560,250.60489 L 320.48430,254.13282 L 302.59815,270.36269 Z " fill="#FFF" stroke="#BBB" stroke-width="0.1" fill-rule="evenodd" /><path d="M 298.44393,304.03579 L 278.14688,297.52716 L 277.42607,296.51606 L 301.07493,279.65690 L 304.39852,303.19500 L 298.44393,304.03579 Z " fill="#A73732" stroke="none" stroke-width="0.2" fill-rule="evenodd" /><text x="206" y="353" fill="#242E31" font-size="2.9280555555555554" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">24 / 25 / 35 · 0.161u²</text><text x="206" y="364" fill="#242E31" font-size="3.5277777777777777" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">세 모듈 결절 / 공동 자원</text><text x="206" y="374.0" fill="#647174" font-size="3.175" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">서로 다른 모듈의 접속이 집중되는 곳. 여러 팀이 함께 쓰는 실내로 유지한다.</text><text x="394" y="234" fill="#A73732" font-size="3.880555555555555" font-family="Instrument Sans" font-weight="400" text-anchor="start" data-font="EN">06  COURT PROTECTION</text><path d="M 425.92815,293.00415 L 441.90591,268.71900 L 472.89189,289.10538 L 446.63280,329.01749 L 454.65655,345.00000 L 419.40909,345.00000 L 419.40909,292.62348 L 425.92815,293.00415 Z " fill="#F1F0ED" stroke="#888" stroke-width="0.17" fill-rule="evenodd" /><path d="M 473.15905,345.00000 L 465.41974,345.00000 L 458.51875,298.88316 L 431.46965,288.23406 L 445.05708,253.72150 L 489.51168,271.22306 L 512.25862,253.12240 L 535.35367,282.14575 L 497.96957,311.89378 L 502.27173,340.64353 L 473.15905,345.00000 Z " fill="#F1F0ED" stroke="#888" stroke-width="0.17" fill-rule="evenodd" /><path d="M 433.92757,330.62534 L 430.22898,330.40937 L 419.40909,323.29071 L 419.40909,310.36433 L 433.67320,303.20327 L 435.33546,306.51433 L 433.92757,330.62534 Z " fill="#FFF" stroke="#BBB" stroke-width="0.1" fill-rule="evenodd" /><path d="M 485.39554,309.46442 L 481.94819,308.10722 L 466.90965,289.20841 L 469.80869,286.90152 L 493.69482,283.32717 L 494.24312,286.99125 L 485.39554,309.46442 Z " fill="#FFF" stroke="#BBB" stroke-width="0.1" fill-rule="evenodd" /><path d="M 534.20244,317.95142 L 531.54556,315.36934 L 524.96217,292.13182 L 528.52676,291.12194 L 544.59091,295.18146 L 544.59091,307.26205 L 534.20244,317.95142 Z " fill="#FFF" stroke="#BBB" stroke-width="0.1" fill-rule="evenodd" /><path d="M 469.68806,286.99751 L 472.89189,289.10538 L 470.14724,293.27706 L 466.90965,289.20841 L 469.68806,286.99751 Z " fill="#A73732" stroke="none" stroke-width="0.2" fill-rule="evenodd" /><text x="394" y="353" fill="#242E31" font-size="2.9280555555555554" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">모듈 13 · 적색 = 제거할 침범 부분</text><text x="394" y="364" fill="#242E31" font-size="3.5277777777777777" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">중정 보존 / 최소 절삭</text><text x="394" y="374.0" fill="#647174" font-size="3.175" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">모듈 13의 중정에 들어온 이웃 바닥 0.00875u²를 제거해 기존 비움을 유지한다.</text></g><g id="99_Footer" inkscape:groupmode="layer" inkscape:label="99_Footer"><path d="M 18.00000,408.00000 L 576.00000,408.00000" fill="none" stroke="#DCE1E1" stroke-width="0.18" stroke-linejoin="miter" /><text x="18" y="415" fill="#647174" font-size="2.504722222222222" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">모든 확대도는 동일 축척의 실제 교집합이다. 맥락 외곽은 표시 창에서 잘렸다. 용도는 공용 오피스 설계 제안이며 세부 실치수·가구 배치는 미확정.</text><text x="576" y="415" fill="#647174" font-size="2.504722222222222" font-family="Instrument Sans" font-weight="400" text-anchor="end" data-font="EN">NTS / DESIGN PROPOSAL</text></g></svg>