venodd" /><path d="M 513.23543,144.30554 L 512.67477,144.45577 L 509.51128,132.64947 L 511.61652,130.54423 L 515.80142,134.72913 L 515.95165,134.16847 L 527.75794,137.33196 L 528.52851,140.20777 L 522.81183,141.73955 L 523.22226,142.14998 L 514.57945,150.79279 L 511.70365,150.02222 L 513.23543,144.30554 Z " fill="#151515" stroke="none" stroke-width="0.2" fill-rule="evenodd" /><path d="M 479.38360,144.30554 L 478.82295,144.45577 L 475.65946,132.64947 L 477.76469,130.54423 L 481.94959,134.72913 L 482.09982,134.16847 L 493.90612,137.33196 L 494.67669,140.20777 L 488.96001,141.73955 L 489.37044,142.14998 L 480.72763,150.79279 L 477.85182,150.02222 L 479.38360,144.30554 Z " fill="#151515" stroke="none" stroke-width="0.2" fill-rule="evenodd" /><path d="M 543.36310,132.64947 L 545.46834,130.54423 L 556.66366,141.73955 L 546.52659,144.45577 L 543.36310,132.64947 Z " fill="#151515" stroke="none" stroke-width="0.2" fill-rule="evenodd" /><path d="M 540.14818,112.83344 L 531.50537,121.47625 L 528.62956,120.70568 L 532.72733,105.41259 L 540.14818,112.83344 Z " fill="#151515" stroke="none" stroke-width="0.2" fill-rule="evenodd" /><path d="M 506.29635,112.83344 L 497.65354,121.47625 L 494.77774,120.70568 L 498.87551,105.41259 L 506.29635,112.83344 Z " fill="#151515" stroke="none" stroke-width="0.2" fill-rule="evenodd" /><path d="M 522.81183,141.73955 L 513.23543,144.30554 L 515.80142,134.72913 L 522.81183,141.73955 Z " fill="#A73732" stroke="none" stroke-width="0.2" fill-rule="evenodd" /><path d="M 488.96001,141.73955 L 479.38360,144.30554 L 481.94959,134.72913 L 488.96001,141.73955 Z " fill="#A73732" stroke="none" stroke-width="0.2" fill-rule="evenodd" /><text x="444" y="209" fill="#242E31" font-size="3.880555555555555" font-family="Instrument Sans" font-weight="400" text-anchor="start" data-font="EN">d = 1.65u / offset = d / 2</text><text x="444" y="218" fill="#647174" font-size="3.175" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">x = d [i + (j mod 2) / 2]</text><text x="444" y="223" fill="#647174" font-size="3.175" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">y = (√3 / 2) d j · 전체 모듈 회전 0°</text><path d="M 18.00000,245.00000 L 576.00000,245.00000" fill="none" stroke="#CCC" stroke-width="0.2" stroke-linejoin="miter" /><text x="18" y="260" fill="#A73732" font-size="3.880555555555555" font-family="Instrument Sans" font-weight="400" text-anchor="start" data-font="EN">01  LOCAL JOINT</text><path d="M 52.04079,299.93767 L 63.52755,303.01554 L 59.61513,317.61690 L 58.49485,313.43597 L 31.23942,320.73904 L 52.04079,299.93767 Z " fill="#151515" stroke="none" stroke-width="0.2" fill-rule="evenodd" /><text x="90" y="286" fill="#242E31" font-size="3.880555555555555" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">한 모듈 내부의 교류</text><text x="90" y="299" fill="#647174" font-size="3.175" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">개별 업무 날개 사이의 소규모 협의 공간.</text><text x="90" y="304" fill="#647174" font-size="3.175" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">세 방향의 경계에서 짧게 만나는 장소.</text><text x="18" y="367" fill="#666" font-size="2.645833333333333" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">형상 확대도 / 각 유형에서 대표 접합 1개 추출</text><text x="206" y="260" fill="#A73732" font-size="3.880555555555555" font-family="Instrument Sans" font-weight="400" text-anchor="start" data-font="EN">02  SHARED SEAM</text><path d="M 233.65505,322.40309 L 226.06240,320.36864 L 230.10658,305.27556 L 255.39004,298.50088 L 236.88126,279.99210 L 256.47365,299.58449 L 233.65505,322.40309 Z " fill="#151515" stroke="none" stroke-width="0.2" fill-rule="evenodd" /><text x="278" y="286" fill="#242E31" font-size="3.880555555555555" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">두 이웃 모듈의 공유 띠</text><text x="278" y="299" fill="#647174" font-size="3.175" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">팀 경계를 가로지르는 공동 작업·검토 장소.</text><text x="278" y="304" fill="#647174" font-size="3.175" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">삼중 결절점으로 넓어지는 진입부.</text><text x="206" y="367" fill="#666" font-size="2.645833333333333" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">형상 확대도 / 각 유형에서 대표 접합 1개 추출</text><text x="394" y="260" fill="#A73732" font-size="3.880555555555555" font-family="Instrument Sans" font-weight="400" text-anchor="start" data-font="EN">03  COLLECTIVE NODE</text><path d="M 422.58863,295.40258 L 441.09742,313.91137 L 415.81395,320.68605 L 422.58863,295.40258 Z " fill="#A73732" stroke="none" stroke-width="0.2" fill-rule="evenodd" /><text x="466" y="286" fill="#242E31" font-size="3.880555555555555" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">세 이웃 모듈의 공유 노드</text><text x="466" y="299" fill="#647174" font-size="3.175" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">서로 다른 팀이 만나는 공동 자원·회의 장소.</text><text x="466" y="304" fill="#647174" font-size="3.175" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">이 중첩은 실내로 유지하고 중정과 구분한다.</text><text x="394" y="367" fill="#666" font-size="2.645833333333333" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">형상 확대도 / 각 유형에서 대표 접합 1개 추출</text><text x="18" y="393" fill="#242E31" font-size="3.5277777777777777" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">비우는 규칙: 모듈 안의 T는 중정. 모듈 사이의 중첩은 공유 실내. 반복으로 남는 자연 틈은 별도의 외부 마당.</text></g><g id="99_Footer" inkscape:groupmode="layer" inkscape:label="99_Footer"><path d="M 18.00000,408.00000 L 576.00000,408.00000" fill="none" stroke="#DCE1E1" stroke-width="0.18" stroke-linejoin="miter" /><text x="18" y="415" fill="#647174" font-size="2.504722222222222" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">발표자료 마지막 M4 스터디의 정규화 모듈을 계승한 설계 가설. 원본 Fruchter House의 정확한 치수 또는 원래 용도를 뜻하지 않는다.</text><text x="576" y="415" fill="#647174" font-size="2.504722222222222" font-family="Instrument Sans" font-weight="400" text-anchor="end" data-font="EN">NTS / DESIGN PROPOSAL</text></g></svg>