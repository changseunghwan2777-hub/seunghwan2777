7276331814" y="126.71875001841798" fill="#242E31" font-size="4.58611111111111" font-family="Instrument Sans" font-weight="400" text-anchor="start" data-font="EN">B</text><path d="M 62.92633,126.71875 L 65.72633,126.71875" fill="none" stroke="#A73732" stroke-width="0.18" stroke-linejoin="miter" /><path d="M 64.32633,125.31875 L 64.32633,128.11875" fill="none" stroke="#A73732" stroke-width="0.18" stroke-linejoin="miter" /><path d="M 100.27367,126.71875 L 103.07367,126.71875" fill="none" stroke="#A73732" stroke-width="0.18" stroke-linejoin="miter" /><path d="M 101.67367,125.31875 L 101.67367,128.11875" fill="none" stroke="#A73732" stroke-width="0.18" stroke-linejoin="miter" /><path d="M 81.60000,159.06250 L 84.40000,159.06250" fill="none" stroke="#A73732" stroke-width="0.18" stroke-linejoin="miter" /><path d="M 83.00000,157.66250 L 83.00000,160.46250" fill="none" stroke="#A73732" stroke-width="0.18" stroke-linejoin="miter" /><path d="M 56.73533,135.09573 L 93.76249,125.17434 L 109.26467,183.02927 L 72.23751,192.95066 L 56.73533,135.09573 Z " fill="none" stroke="#777" stroke-width="0.32" fill-rule="evenodd" /><text x="83.0" y="159.0625" fill="#242E31" font-size="4.58611111111111" font-family="Instrument Sans" font-weight="400" text-anchor="start" data-font="EN">C</text><path d="M 62.92633,126.71875 L 65.72633,126.71875" fill="none" stroke="#A73732" stroke-width="0.18" stroke-linejoin="miter" /><path d="M 64.32633,125.31875 L 64.32633,128.11875" fill="none" stroke="#A73732" stroke-width="0.18" stroke-linejoin="miter" /><path d="M 100.27367,126.71875 L 103.07367,126.71875" fill="none" stroke="#A73732" stroke-width="0.18" stroke-linejoin="miter" /><path d="M 101.67367,125.31875 L 101.67367,128.11875" fill="none" stroke="#A73732" stroke-width="0.18" stroke-linejoin="miter" /><path d="M 81.60000,159.06250 L 84.40000,159.06250" fill="none" stroke="#A73732" stroke-width="0.18" stroke-linejoin="miter" /><path d="M 83.00000,157.66250 L 83.00000,160.46250" fill="none" stroke="#A73732" stroke-width="0.18" stroke-linejoin="miter" /><text x="18" y="209" fill="#242E31" font-size="3.880555555555555" font-family="Instrument Sans" font-weight="400" text-anchor="start" data-font="EN">L = 1.25u / W = 0.80u</text><text x="18" y="218" fill="#647174" font-size="3.175" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">중심 간격 R = 0.45u · 120° 간격</text><text x="18" y="223" fill="#647174" font-size="3.175" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">각 공간군의 장축에 공통 비틀림 +15°</text><text x="160" y="69" fill="#242E31" font-size="3.175" font-family="Instrument Sans" font-weight="400" text-anchor="start" data-font="EN">02 / SUBTRACT THE COURT</text><path d="M 214.23751,192.95066 L 201.45806,145.25709 L 172.43816,137.48124 L 182.35956,100.45408 L 230.05313,113.23353 L 251.29717,91.98950 L 278.40293,119.09525 L 243.48881,154.00937 L 251.26467,183.02927 L 214.23751,192.95066 Z M 230.29309,152.98342 L 236.75350,128.87285 L 235.76249,125.17434 L 211.65192,131.63474 L 208.94442,134.34225 L 226.59458,151.99240 L 230.29309,152.98342 Z " fill="#151515" stroke="none" stroke-width="0.2" fill-rule="evenodd" /><path d="M 226.59458,151.99240 L 208.94442,134.34225 L 211.65192,131.63474 L 235.76249,125.17434 L 236.75350,128.87285 L 230.29309,152.98342 L 226.59458,151.99240 Z " fill="#F6E8E3" stroke="#A73732" stroke-width="0.25" fill-rule="evenodd" /><text x="160" y="209" fill="#242E31" font-size="3.880555555555555" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">U = (A ∪ B ∪ C) − T</text><text x="160" y="218" fill="#647174" font-size="3.175" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">T = A ∩ B ∩ C</text><text x="160" y="223" fill="#647174" font-size="3.175" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">이전 스터디의 삼중 중첩을 중정으로 유지</text><text x="302" y="69" fill="#242E31" font-size="3.175" font-family="Instrument Sans" font-weight="400" text-anchor="start" data-font="EN">03 / ONE WORK NEIGHBOURHOOD</text><path d="M 356.23751,192.95066 L 343.45806,145.25709 L 314.43816,137.48124 L 324.35956,100.45408 L 372.05313,113.23353 L 393.29717,91.98950 L 420.40293,119.09525 L 385.48881,154.00937 L 393.26467,183.02927 L 356.23751,192.95066 Z M 372.29309,152.98342 L 378.75350,128.87285 L 377.76249,125.17434 L 353.65192,131.63474 L 350.94442,134.34225 L 368.59458,151.99240 L 372.29309,152.98342 Z " fill="#151515" stroke="none" stroke-width="0.2" fill-rule="evenodd" /><path d="M 372.05313,113.23353 L 382.21449,115.95626 L 378.75350,128.87285 L 377.76249,125.17434 L 353.65192,131.63474 L 372.05313,113.23353 Z " fill="#B97A61" stroke="none" stroke-width="0.2" fill-rule="evenodd" /><path d="M 385.48881,154.00937 L 378.05018,161.44800 L 368.59458,151.99240 L 372.29309,152.98342 L 378.75350,128.87285 L 385.48881,154.00937 Z " fill="#B97A61" stroke="none" stroke-width="0.2" fill-rule="evenodd" /><path d="M 343.45806,145.25709 L 340.73533,135.09573 L 353.65192,131.63474 L 350.94442,134.34225 L 368.59458,151.99240 L 343.45806,145.25709 Z " fill="#B97A61" stroke="none" stroke-width="0.2" fill-rule="evenodd" /><text x="302" y="209" fill="#242E31" font-size="3.880555555555555" font-family="Instrument Sans" font-weight="400" text-anchor="start" data-font="EN">U = one repeatable motif</text><text x="302" y="218" fill="#647174" font-size="3.175" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">세 개의 날개와 하나의 중정을 묶어 반복</text><text x="302" y="223" fill="#647174" font-size="3.175" font-family="Noto Sans KR" font-weight="450" text-anchor="start" data-font="KR">개별 날개를 임의로 재배치하지 않는다</text><text x="444" y="69" fill="#242E31" font-size="3.175" font-family="Instrument Sans" font-weight="400" text-anchor="start" data-font="EN">04 / REPEAT ON A LATTICE</text><path d="M 444.00000,150.02222 L 448.24800,134.16847 L 468.66873,139.64019 L 475.65946,132.64947 L 473.35123,124.03503 L 460.92591,120.